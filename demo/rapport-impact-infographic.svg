<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" style="background: linear-gradient(135deg, #0F172A 0%, #1E293B 100%);">
  <defs>
    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#06B6D4;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#22D3EE;stop-opacity:1" />
    </linearGradient>
    
    <linearGradient id="successGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#10B981;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#34D399;stop-opacity:1" />
    </linearGradient>
    
    <linearGradient id="warningGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#F59E0B;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#FBBF24;stop-opacity:1" />
    </linearGradient>
    
    <linearGradient id="purpleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#8B5CF6;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#A78BFA;stop-opacity:1" />
    </linearGradient>
    
    <filter id="glow">
      <feGaussianBlur stdDeviation="4" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    
    <filter id="shadow">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-opacity="0.3"/>
    </filter>
  </defs>
  
  <!-- Titre principal -->
  <text x="600" y="60" font-family="'Arial Black', sans-serif" font-size="42" font-weight="900" fill="url(#primaryGrad)" text-anchor="middle" filter="url(#glow)">
    IMPACT DU PROJET
  </text>
  
  <text x="600" y="95" font-family="Arial, sans-serif" font-size="18" fill="#94A3B8" text-anchor="middle">
    Générateur de Rapports PDF - Métriques Clés
  </text>
  
  <line x1="200" y1="120" x2="1000" y2="120" stroke="url(#primaryGrad)" stroke-width="2" opacity="0.5"/>
  
  <!-- Section 1: Statistiques principales -->
  <g id="main-stats">
    <!-- Carte 1: Temps gagné -->
    <g transform="translate(100, 160)">
      <rect width="320" height="180" rx="16" fill="#1E293B" stroke="#334155" stroke-width="2" filter="url(#shadow)"/>
      
      <circle cx="60" cy="50" r="35" fill="url(#successGrad)" opacity="0.2"/>
      <circle cx="60" cy="50" r="20" fill="url(#successGrad)"/>
      
      <text x="160" y="50" font-family="'Arial Black', sans-serif" font-size="48" font-weight="900" fill="url(#successGrad)">95%</text>
      <text x="160" y="80" font-family="Arial, sans-serif" font-size="16" fill="#F8FAFC" font-weight="600">TEMPS GAGNÉ</text>
      <text x="160" y="105" font-family="Arial, sans-serif" font-size="13" fill="#94A3B8">vs. création manuelle</text>
      
      <rect x="20" y="130" width="280" height="8" rx="4" fill="#334155"/>
      <rect x="20" y="130" width="266" rx="4" fill="url(#successGrad)">
        <animate attributeName="width" from="0" to="266" dur="1.5s" fill="freeze"/>
      </rect>
      
      <text x="160" y="160" font-family="Arial, sans-serif" font-size="12" fill="#64748B" text-anchor="middle">5 min → 15 sec par rapport</text>
    </g>
    
    <!-- Carte 2: Rapports générés -->
    <g transform="translate(450, 160)">
      <rect width="320" height="180" rx="16" fill="#1E293B" stroke="#334155" stroke-width="2" filter="url(#shadow)"/>
      
      <circle cx="60" cy="50" r="35" fill="url(#primaryGrad)" opacity="0.2"/>
      <circle cx="60" cy="50" r="20" fill="url(#primaryGrad)"/>
      
      <text x="160" y="50" font-family="'Arial Black', sans-serif" font-size="48" font-weight="900" fill="url(#primaryGrad)">500+</text>
      <text x="160" y="80" font-family="Arial, sans-serif" font-size="16" fill="#F8FAFC" font-weight="600">RAPPORTS</text>
      <text x="160" y="105" font-family="Arial, sans-serif" font-size="13" fill="#94A3B8">générés automatiquement</text>
      
      <g transform="translate(20, 125)">
        <rect x="0" y="0" width="25" height="30" rx="3" fill="url(#primaryGrad)" opacity="0.3"/>
        <rect x="30" y="0" width="25" height="30" rx="3" fill="url(#primaryGrad)" opacity="0.5"/>
        <rect x="60" y="0" width="25" height="30" rx="3" fill="url(#primaryGrad)" opacity="0.7"/>
        <rect x="90" y="0" width="25" height="30" rx="3" fill="url(#primaryGrad)" opacity="0.9"/>
        <text x="130" y="20" font-family="Arial, sans-serif" font-size="18" fill="url(#primaryGrad)" font-weight="700">+496</text>
      </g>
    </g>
    
    <!-- Carte 3: Précision -->
    <g transform="translate(800, 160)">
      <rect width="320" height="180" rx="16" fill="#1E293B" stroke="#334155" stroke-width="2" filter="url(#shadow)"/>
      
      <circle cx="60" cy="50" r="35" fill="url(#purpleGrad)" opacity="0.2"/>
      <circle cx="60" cy="50" r="20" fill="url(#purpleGrad)"/>
      
      <text x="160" y="50" font-family="'Arial Black', sans-serif" font-size="48" font-weight="900" fill="url(#purpleGrad)">100%</text>
      <text x="160" y="80" font-family="Arial, sans-serif" font-size="16" fill="#F8FAFC" font-weight="600">PRÉCISION</text>
      <text x="160" y="105" font-family="Arial, sans-serif" font-size="13" fill="#94A3B8">Zéro erreur de calcul</text>
      
      <g transform="translate(30, 130)">
        <circle cx="0" cy="0" r="8" fill="url(#purpleGrad)"/>
        <path d="M -3 0 L -1 2 L 3 -2" stroke="#FFF" stroke-width="2" fill="none"/>
        <text x="20" y="5" font-family="Arial, sans-serif" font-size="11" fill="#94A3B8">Calculs automatisés</text>
        
        <circle cx="150" cy="0" r="8" fill="url(#purpleGrad)"/>
        <path d="M 147 0 L 149 2 L 153 -2" stroke="#FFF" stroke-width="2" fill="none"/>
        <text x="170" y="5" font-family="Arial, sans-serif" font-size="11" fill="#94A3B8">Validations</text>
      </g>
    </g>
  </g>
  
  <!-- Section 2: Workflow visuel -->
  <g id="workflow" transform="translate(0, 380)">
    <text x="600" y="0" font-family="Arial, sans-serif" font-size="24" font-weight="700" fill="#F8FAFC" text-anchor="middle">
      WORKFLOW AUTOMATISÉ
    </text>
    
    <!-- Étape 1 -->
    <g transform="translate(150, 40)">
      <rect width="200" height="100" rx="12" fill="#1E293B" stroke="url(#successGrad)" stroke-width="3"/>
      <circle cx="100" cy="35" r="18" fill="url(#successGrad)"/>
      <text x="100" y="60" font-family="Arial, sans-serif" font-size="14" font-weight="600" fill="#F8FAFC" text-anchor="middle">Fichier Excel</text>
      <text x="100" y="80" font-family="Arial, sans-serif" font-size="11" fill="#94A3B8" text-anchor="middle">notes.xlsx</text>
    </g>
    
    <!-- Flèche 1 -->
    <path d="M 360 90 L 420 90" stroke="url(#primaryGrad)" stroke-width="3" fill="none"/>
    <path d="M 415 85 L 425 90 L 415 95 Z" fill="url(#primaryGrad)"/>
    <text x="390" y="82" font-family="Arial, sans-serif" font-size="12" fill="#64748B" text-anchor="middle">pandas</text>
    
    <!-- Étape 2 -->
    <g transform="translate(430, 40)">
      <rect width="200" height="100" rx="12" fill="#1E293B" stroke="url(#warningGrad)" stroke-width="3"/>
      <circle cx="100" cy="35" r="18" fill="url(#warningGrad)"/>
      <text x="100" y="60" font-family="Arial, sans-serif" font-size="14" font-weight="600" fill="#F8FAFC" text-anchor="middle">Calcul Auto</text>
      <text x="100" y="80" font-family="Arial, sans-serif" font-size="11" fill="#94A3B8" text-anchor="middle">Moyennes + Analyse</text>
    </g>
    
    <!-- Flèche 2 -->
    <path d="M 640 90 L 700 90" stroke="url(#primaryGrad)" stroke-width="3" fill="none"/>
    <path d="M 695 85 L 705 90 L 695 95 Z" fill="url(#primaryGrad)"/>
    <text x="670" y="82" font-family="Arial, sans-serif" font-size="12" fill="#64748B" text-anchor="middle">FPDF</text>
    
    <!-- Étape 3 -->
    <g transform="translate(710, 40)">
      <rect width="200" height="100" rx="12" fill="#1E293B" stroke="url(#purpleGrad)" stroke-width="3"/>
      <circle cx="100" cy="35" r="18" fill="url(#purpleGrad)"/>
      <text x="100" y="60" font-family="Arial, sans-serif" font-size="14" font-weight="600" fill="#F8FAFC" text-anchor="middle">PDFs Générés</text>
      <text x="100" y="80" font-family="Arial, sans-serif" font-size="11" fill="#94A3B8" text-anchor="middle">Rapports individuels</text>
    </g>
  </g>
  
  <!-- Section 3: Technologies et compétences -->
  <g id="tech-skills" transform="translate(0, 590)">
    <text x="600" y="0" font-family="Arial, sans-serif" font-size="24" font-weight="700" fill="#F8FAFC" text-anchor="middle">
      TECHNOLOGIES &amp; COMPÉTENCES
    </text>
    
    <g transform="translate(200, 30)">
      <rect x="0" y="0" width="140" height="50" rx="25" fill="url(#primaryGrad)" opacity="0.2" stroke="url(#primaryGrad)" stroke-width="2"/>
      <text x="70" y="32" font-family="Arial, sans-serif" font-size="16" font-weight="700" fill="url(#primaryGrad)" text-anchor="middle">Python</text>
      
      <rect x="160" y="0" width="140" height="50" rx="25" fill="url(#successGrad)" opacity="0.2" stroke="url(#successGrad)" stroke-width="2"/>
      <text x="230" y="32" font-family="Arial, sans-serif" font-size="16" font-weight="700" fill="url(#successGrad)" text-anchor="middle">Pandas</text>
      
      <rect x="320" y="0" width="140" height="50" rx="25" fill="url(#warningGrad)" opacity="0.2" stroke="url(#warningGrad)" stroke-width="2"/>
      <text x="390" y="32" font-family="Arial, sans-serif" font-size="16" font-weight="700" fill="url(#warningGrad)" text-anchor="middle">FPDF</text>
      
      <rect x="480" y="0" width="140" height="50" rx="25" fill="url(#purpleGrad)" opacity="0.2" stroke="url(#purpleGrad)" stroke-width="2"/>
      <text x="550" y="32" font-family="Arial, sans-serif" font-size="16" font-weight="700" fill="url(#purpleGrad)" text-anchor="middle">Excel</text>
      
      <rect x="640" y="0" width="160" height="50" rx="25" fill="url(#primaryGrad)" opacity="0.2" stroke="url(#primaryGrad)" stroke-width="2"/>
      <text x="720" y="32" font-family="Arial, sans-serif" font-size="16" font-weight="700" fill="url(#primaryGrad)" text-anchor="middle">Automation</text>
    </g>
  </g>
  
  <!-- Section 4: Métriques de performance -->
  <g id="performance" transform="translate(100, 700)">
    <g>
      <text x="0" y="15" font-family="Arial, sans-serif" font-size="13" fill="#94A3B8" font-weight="600">Efficacité</text>
      <rect x="150" y="0" width="850" height="20" rx="10" fill="#334155"/>
      <rect x="150" y="0" width="807" height="20" rx="10" fill="url(#successGrad)">
        <animate attributeName="width" from="0" to="807" dur="2s" fill="freeze"/>
      </rect>
      <text x="970" y="15" font-family="'Arial Black', sans-serif" font-size="14" fill="#10B981" font-weight="900">95%</text>
    </g>
    
    <g transform="translate(0, 35)">
      <text x="0" y="15" font-family="Arial, sans-serif" font-size="13" fill="#94A3B8" font-weight="600">Précision</text>
      <rect x="150" y="0" width="850" height="20" rx="10" fill="#334155"/>
      <rect x="150" y="0" width="850" height="20" rx="10" fill="url(#purpleGrad)">
        <animate attributeName="width" from="0" to="850" dur="2s" fill="freeze"/>
      </rect>
      <text x="970" y="15" font-family="'Arial Black', sans-serif" font-size="14" fill="#8B5CF6" font-weight="900">100%</text>
    </g>
    
    <g transform="translate(0, 70)">
      <text x="0" y="15" font-family="Arial, sans-serif" font-size="13" fill="#94A3B8" font-weight="600">Scalabilité</text>
      <rect x="150" y="0" width="850" height="20" rx="10" fill="#334155"/>
      <rect x="150" y="0" width="722" height="20" rx="10" fill="url(#primaryGrad)">
        <animate attributeName="width" from="0" to="722" dur="2s" fill="freeze"/>
      </rect>
      <text x="970" y="15" font-family="'Arial Black', sans-serif" font-size="14" fill="#06B6D4" font-weight="900">85%</text>
    </g>
  </g>
  
  <!-- Effet de particules animées -->
  <g opacity="0.3">
    <circle cx="100" cy="150" r="3" fill="#06B6D4">
      <animate attributeName="cy" values="150;50;150" dur="4s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;1;0" dur="4s" repeatCount="indefinite"/>
    </circle>
    <circle cx="1100" cy="200" r="2" fill="#10B981">
      <animate attributeName="cy" values="200;100;200" dur="5s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;1;0" dur="5s" repeatCount="indefinite"/>
    </circle>
    <circle cx="150" cy="600" r="2.5" fill="#8B5CF6">
      <animate attributeName="cy" values="600;500;600" dur="4.5s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;1;0" dur="4.5s" repeatCount="indefinite"/>
    </circle>
  </g>
</svg>