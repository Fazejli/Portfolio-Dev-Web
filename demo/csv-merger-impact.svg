<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500">
  <defs>
    <style>
      .card { fill: white; stroke: #E5E7EB; stroke-width: 2; filter: drop-shadow(0 4px 6px rgba(0,0,0,0.1)); }
      .title-text { fill: #1F2937; font-family: Arial, sans-serif; font-size: 26px; font-weight: bold; }
      .metric-number { font-family: Arial, sans-serif; font-size: 42px; font-weight: bold; }
      .metric-label { fill: #6B7280; font-family: Arial, sans-serif; font-size: 13px; }
    </style>
  </defs>
  
  <!-- Title -->
  <text x="400" y="40" class="title-text" text-anchor="middle">🔄 Efficacité du Pipeline de Fusion</text>
  
  <!-- Top Metrics Row -->
  <g>
    <!-- Metric 1: Files supported -->
    <rect x="50" y="70" width="220" height="120" class="card" rx="12"/>
    <circle cx="160" cy="110" r="30" fill="#EEF2FF" opacity="0.3"/>
    <text x="160" y="120" style="font-size: 35px; text-anchor: middle;">📁</text>
    <text x="160" y="165" class="metric-number" fill="#7C3AED" text-anchor="middle">∞</text>
    <text x="160" y="185" class="metric-label" text-anchor="middle">Fichiers supportés</text>
    
    <!-- Metric 2: Formats -->
    <rect x="290" y="70" width="220" height="120" class="card" rx="12"/>
    <circle cx="400" cy="110" r="30" fill="#DBEAFE" opacity="0.3"/>
    <text x="400" y="120" style="font-size: 35px; text-anchor: middle;">🔀</text>
    <text x="400" y="165" class="metric-number" fill="#3B82F6" text-anchor="middle">2+</text>
    <text x="400" y="185" class="metric-label" text-anchor="middle">Formats détectés</text>
    
    <!-- Metric 3: Speed -->
    <rect x="530" y="70" width="220" height="120" class="card" rx="12"/>
    <circle cx="640" cy="110" r="30" fill="#ECFDF5" opacity="0.3"/>
    <text x="640" y="120" style="font-size: 35px; text-anchor: middle;">⚡</text>
    <text x="640" y="165" class="metric-number" fill="#10B981" text-anchor="middle">&lt;1s</text>
    <text x="640" y="185" class="metric-label" text-anchor="middle">Temps d'exécution</text>
  </g>
  
  <!-- Use Cases Section -->
  <text x="400" y="240" style="fill: #1F2937; font-size: 20px; font-weight: bold; text-anchor: middle; font-family: Arial;">💼 Cas d'usage</text>
  
  <g>
    <!-- Use case 1 -->
    <rect x="50" y="260" width="340" height="200" fill="#F9FAFB" stroke="#E5E7EB" stroke-width="2" rx="12"/>
    <text x="220" y="285" style="fill: #1F2937; font-size: 16px; font-weight: bold; text-anchor: middle; font-family: Arial;">📊 Consolidation CRM</text>
    
    <g transform="translate(70, 305)">
      <circle cx="0" cy="0" r="4" fill="#7C3AED"/>
      <text x="15" y="4" style="fill: #374151; font-size: 13px; font-family: Arial;">Fusion de bases clients multiples</text>
    </g>
    
    <g transform="translate(70, 330)">
      <circle cx="0" cy="0" r="4" fill="#7C3AED"/>
      <text x="15" y="4" style="fill: #374151; font-size: 13px; font-family: Arial;">Export depuis différents outils</text>
    </g>
    
    <g transform="translate(70, 355)">
      <circle cx="0" cy="0" r="4" fill="#7C3AED"/>
      <text x="15" y="4" style="fill: #374151; font-size: 13px; font-family: Arial;">Migration de données</text>
    </g>
    
    <g transform="translate(70, 380)">
      <circle cx="0" cy="0" r="4" fill="#7C3AED"/>
      <text x="15" y="4" style="fill: #374151; font-size: 13px; font-family: Arial;">Préparation pour import unique</text>
    </g>
    
    <rect x="70" y="400" width="280" height="40" fill="#EEF2FF" rx="6"/>
    <text x="210" y="420" style="fill: #5B21B6; font-size: 12px; font-weight: bold; text-anchor: middle; font-family: Arial;">✓ Économie : 2-3h de travail manuel</text>
    <text x="210" y="435" style="fill: #6B7280; font-size: 10px; text-anchor: middle; font-family: Arial;">par consolidation</text>
    
    <!-- Use case 2 -->
    <rect x="410" y="260" width="340" height="200" fill="#F9FAFB" stroke="#E5E7EB" stroke-width="2" rx="12"/>
    <text x="580" y="285" style="fill: #1F2937; font-size: 16px; font-weight: bold; text-anchor: middle; font-family: Arial;">📧 Campagnes Marketing</text>
    
    <g transform="translate(430, 305)">
      <circle cx="0" cy="0" r="4" fill="#3B82F6"/>
      <text x="15" y="4" style="fill: #374151; font-size: 13px; font-family: Arial;">Agrégation listes d'emails</text>
    </g>
    
    <g transform="translate(430, 330)">
      <circle cx="0" cy="0" r="4" fill="#3B82F6"/>
      <text x="15" y="4" style="fill: #374151; font-size: 13px; font-family: Arial;">Nettoyage automatique</text>
    </g>
    
    <g transform="translate(430, 355)">
      <circle cx="0" cy="0" r="4" fill="#3B82F6"/>
      <text x="15" y="4" style="fill: #374151; font-size: 13px; font-family: Arial;">Format prêt pour Mailchimp/Sendinblue</text>
    </g>
    
    <g transform="translate(430, 380)">
      <circle cx="0" cy="0" r="4" fill="#3B82F6"/>
      <text x="15" y="4" style="fill: #374151; font-size: 13px; font-family: Arial;">Évite doublons et erreurs</text>
    </g>
    
    <rect x="430" y="400" width="280" height="40" fill="#DBEAFE" rx="6"/>
    <text x="570" y="420" style="fill: #1E40AF; font-size: 12px; font-weight: bold; text-anchor: middle; font-family: Arial;">✓ Prêt en secondes vs heures</text>
    <text x="570" y="435" style="fill: #6B7280; font-size: 10px; text-anchor: middle; font-family: Arial;">de copier-coller manuel</text>
  </g>
</svg>