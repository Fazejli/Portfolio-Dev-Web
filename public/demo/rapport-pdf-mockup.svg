<svg viewBox="0 0 900 1100" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <filter id="shadow">
      <feDropShadow dx="0" dy="8" stdDeviation="8" flood-opacity="0.4"/>
    </filter>
    <linearGradient id="headerGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#3b82f6;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#8b5cf6;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Background -->
  <rect width="900" height="1100" fill="#0f172a"/>
  
  <!-- Title -->
  <text x="450" y="50" font-size="32" font-weight="bold" fill="#e2e8f0" text-anchor="middle" font-family="Arial, sans-serif">
    📄 Exemple de Rapport PDF Généré
  </text>
  
  <!-- PDF Document -->
  <g transform="translate(150, 100)">
    <!-- Paper -->
    <rect width="600" height="900" rx="10" fill="#ffffff" filter="url(#shadow)"/>
    
    <!-- Header -->
    <rect width="600" height="120" rx="10" fill="url(#headerGrad)"/>
    
    <!-- Logo/Icon -->
    <text x="300" y="50" font-size="36" text-anchor="middle" fill="#fff">🎓</text>
    
    <!-- Header Text -->
    <text x="300" y="90" font-size="26" font-weight="bold" text-anchor="middle" fill="#fff" font-family="Arial, sans-serif">
      BULLETIN DE NOTES
    </text>
    <text x="300" y="110" font-size="14" text-anchor="middle" fill="#e0e7ff" font-family="Arial, sans-serif">
      Année Scolaire 2024-2025
    </text>
    
    <!-- Student Info Section -->
    <g transform="translate(40, 160)">
      <text x="0" y="0" font-size="18" font-weight="bold" fill="#1e293b" font-family="Arial, sans-serif">
        Informations de l'élève
      </text>
      <line x1="0" y1="8" x2="520" y2="8" stroke="#cbd5e1" stroke-width="2"/>
      
      <text x="0" y="40" font-size="15" fill="#475569" font-family="Arial, sans-serif">
        <tspan font-weight="bold">Nom :</tspan> DUPONT Jean
      </text>
      <text x="0" y="65" font-size="15" fill="#475569" font-family="Arial, sans-serif">
        <tspan font-weight="bold">Classe :</tspan> 3ème A
      </text>
      <text x="0" y="90" font-size="15" fill="#475569" font-family="Arial, sans-serif">
        <tspan font-weight="bold">Trimestre :</tspan> 2
      </text>
    </g>
    
    <!-- Grades Table -->
    <g transform="translate(40, 310)">
      <text x="0" y="0" font-size="18" font-weight="bold" fill="#1e293b" font-family="Arial, sans-serif">
        Résultats par matière
      </text>
      <line x1="0" y1="8" x2="520" y2="8" stroke="#cbd5e1" stroke-width="2"/>
      
      <!-- Table Header -->
      <rect x="0" y="25" width="520" height="40" fill="#f1f5f9"/>
      <text x="20" y="50" font-size="14" font-weight="bold" fill="#1e293b" font-family="Arial, sans-serif">Matière</text>
      <text x="280" y="50" font-size="14" font-weight="bold" fill="#1e293b" text-anchor="middle" font-family="Arial, sans-serif">Note /20</text>
      <text x="420" y="50" font-size="14" font-weight="bold" fill="#1e293b" text-anchor="middle" font-family="Arial, sans-serif">Appréciation</text>
      
      <!-- Row 1 -->
      <rect x="0" y="65" width="520" height="35" fill="#ffffff"/>
      <text x="20" y="88" font-size="13" fill="#475569" font-family="Arial, sans-serif">Mathématiques</text>
      <text x="280" y="88" font-size="13" fill="#475569" text-anchor="middle" font-family="Arial, sans-serif">16.5</text>
      <text x="420" y="88" font-size="11" fill="#10b981" text-anchor="middle" font-family="Arial, sans-serif">Très bien</text>
      
      <!-- Row 2 -->
      <rect x="0" y="100" width="520" height="35" fill="#f8fafc"/>
      <text x="20" y="123" font-size="13" fill="#475569" font-family="Arial, sans-serif">Français</text>
      <text x="280" y="123" font-size="13" fill="#475569" text-anchor="middle" font-family="Arial, sans-serif">14.0</text>
      <text x="420" y="123" font-size="11" fill="#10b981" text-anchor="middle" font-family="Arial, sans-serif">Bien</text>
      
      <!-- Row 3 -->
      <rect x="0" y="135" width="520" height="35" fill="#ffffff"/>
      <text x="20" y="158" font-size="13" fill="#475569" font-family="Arial, sans-serif">Anglais</text>
      <text x="280" y="158" font-size="13" fill="#475569" text-anchor="middle" font-family="Arial, sans-serif">12.5</text>
      <text x="420" y="158" font-size="11" fill="#3b82f6" text-anchor="middle" font-family="Arial, sans-serif">Assez bien</text>
      
      <!-- Row 4 -->
      <rect x="0" y="170" width="520" height="35" fill="#f8fafc"/>
      <text x="20" y="193" font-size="13" fill="#475569" font-family="Arial, sans-serif">Histoire-Géo</text>
      <text x="280" y="193" font-size="13" fill="#475569" text-anchor="middle" font-family="Arial, sans-serif">13.5</text>
      <text x="420" y="193" font-size="11" fill="#10b981" text-anchor="middle" font-family="Arial, sans-serif">Bien</text>
      
      <!-- Row 5 -->
      <rect x="0" y="205" width="520" height="35" fill="#ffffff"/>
      <text x="20" y="228" font-size="13" fill="#475569" font-family="Arial, sans-serif">Sciences</text>
      <text x="280" y="228" font-size="13" fill="#475569" text-anchor="middle" font-family="Arial, sans-serif">15.0</text>
      <text x="420" y="228" font-size="11" fill="#10b981" text-anchor="middle" font-family="Arial, sans-serif">Bien</text>
    </g>
    
    <!-- Average Box -->
    <g transform="translate(40, 585)">
      <rect width="520" height="80" rx="10" fill="#eff6ff" stroke="#3b82f6" stroke-width="2"/>
      <text x="260" y="30" font-size="16" font-weight="bold" fill="#1e293b" text-anchor="middle" font-family="Arial, sans-serif">
        MOYENNE GÉNÉRALE
      </text>
      <text x="260" y="60" font-size="32" font-weight="bold" fill="#3b82f6" text-anchor="middle" font-family="Arial, sans-serif">
        14.3 / 20
      </text>
    </g>
    
    <!-- Comment Section -->
    <g transform="translate(40, 695)">
      <text x="0" y="0" font-size="16" font-weight="bold" fill="#1e293b" font-family="Arial, sans-serif">
        💬 Appréciation générale
      </text>
      <rect x="0" y="10" width="520" height="110" rx="8" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/>
      <text x="20" y="40" font-size="13" fill="#475569" font-family="Arial, sans-serif">
        <tspan x="20" dy="0">Très bon trimestre ! L'élève fait preuve de sérieux et</tspan>
        <tspan x="20" dy="22">d'application dans son travail. Les résultats sont</tspan>
        <tspan x="20" dy="22">satisfaisants dans l'ensemble. Continuez ainsi !</tspan>
      </text>
    </g>
    
    <!-- Footer -->
    <text x="300" y="870" font-size="11" fill="#94a3b8" text-anchor="middle" font-family="Arial, sans-serif">
      Document généré automatiquement le 06/02/2026
    </text>
  </g>
</svg>