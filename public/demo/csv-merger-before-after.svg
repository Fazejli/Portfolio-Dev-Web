<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 900" style="background: linear-gradient(135deg, #0F172A 0%, #1E293B 100%);">
  <defs>
    <!-- Gradients -->
    <linearGradient id="dangerGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#EF4444;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#DC2626;stop-opacity:1" />
    </linearGradient>
    
    <linearGradient id="successGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#10B981;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#059669;stop-opacity:1" />
    </linearGradient>
    
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#06B6D4;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0891B2;stop-opacity:1" />
    </linearGradient>
    
    <!-- Filters -->
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    
    <filter id="shadow">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-opacity="0.3"/>
    </filter>
  </defs>
  
  <!-- Titre principal -->
  <text x="700" y="60" font-family="'Arial Black', sans-serif" font-size="48" font-weight="900" fill="url(#accentGrad)" text-anchor="middle" filter="url(#glow)">
    CSV DATA MERGER
  </text>
  
  <text x="700" y="95" font-family="Arial, sans-serif" font-size="20" fill="#94A3B8" text-anchor="middle">
    Avant / Après — Transformation des données
  </text>
  
  <!-- Ligne de séparation -->
  <line x1="200" y1="120" x2="1200" y2="120" stroke="url(#accentGrad)" stroke-width="2" opacity="0.5"/>
  
  <!-- ========== SECTION AVANT (GAUCHE) ========== -->
  <g id="before-section">
    <!-- Badge AVANT -->
    <rect x="150" y="160" width="480" height="60" rx="12" fill="url(#dangerGrad)" opacity="0.2" stroke="url(#dangerGrad)" stroke-width="3"/>
    <text x="390" y="198" font-family="'Arial Black', sans-serif" font-size="28" font-weight="900" fill="url(#dangerGrad)" text-anchor="middle">
      ❌ AVANT — Chaos de Données
    </text>
    
    <!-- Fichier 1 -->
    <g transform="translate(150, 250)">
      <rect width="220" height="140" rx="12" fill="#1E293B" stroke="#EF4444" stroke-width="2" filter="url(#shadow)"/>
      
      <g transform="translate(10, 15)">
        <text x="0" y="0" font-family="Arial, sans-serif" font-size="14" font-weight="700" fill="#EF4444">
          📄 fichier1.txt
        </text>
        <text x="0" y="25" font-family="'Courier New', monospace" font-size="11" fill="#94A3B8">
          Nom;Prénom;Age;Ville
        </text>
        <text x="0" y="45" font-family="'Courier New', monospace" font-size="11" fill="#F8FAFC">
          Martin;Sophie;28;Paris
        </text>
        <text x="0" y="65" font-family="'Courier New', monospace" font-size="11" fill="#F8FAFC">
          Dubois;Luc;35;Lyon
        </text>
        <text x="0" y="85" font-family="'Courier New', monospace" font-size="11" fill="#F8FAFC">
          Bernard;Emma;42;Lille
        </text>
        <text x="0" y="105" font-family="Arial, sans-serif" font-size="10" fill="#64748B" font-style="italic">
          Format: CSV (;)
        </text>
      </g>
    </g>
    
    <!-- Fichier 2 -->
    <g transform="translate(400, 250)">
      <rect width="220" height="140" rx="12" fill="#1E293B" stroke="#F59E0B" stroke-width="2" filter="url(#shadow)"/>
      
      <g transform="translate(10, 15)">
        <text x="0" y="0" font-family="Arial, sans-serif" font-size="14" font-weight="700" fill="#F59E0B">
          📄 fichier2.txt
        </text>
        <text x="0" y="25" font-family="'Courier New', monospace" font-size="11" fill="#94A3B8">
          Nom    Prénom    Age    Ville
        </text>
        <text x="0" y="45" font-family="'Courier New', monospace" font-size="11" fill="#F8FAFC">
          Petit    Marie    31    Nice
        </text>
        <text x="0" y="65" font-family="'Courier New', monospace" font-size="11" fill="#F8FAFC">
          Robert    Paul    29    Marseille
        </text>
        <text x="0" y="85" font-family="'Courier New', monospace" font-size="11" fill="#F8FAFC">
          Moreau    Julie    26    Bordeaux
        </text>
        <text x="0" y="105" font-family="Arial, sans-serif" font-size="10" fill="#64748B" font-style="italic">
          Format: TSV (tabs)
        </text>
      </g>
    </g>
    
    <!-- Fichier 3 -->
    <g transform="translate(150, 420)">
      <rect width="220" height="140" rx="12" fill="#1E293B" stroke="#8B5CF6" stroke-width="2" filter="url(#shadow)"/>
      
      <g transform="translate(10, 15)">
        <text x="0" y="0" font-family="Arial, sans-serif" font-size="14" font-weight="700" fill="#8B5CF6">
          📄 fichier3.txt
        </text>
        <text x="0" y="25" font-family="'Courier New', monospace" font-size="11" fill="#94A3B8">
          Nom,Prénom,Age,Ville
        </text>
        <text x="0" y="45" font-family="'Courier New', monospace" font-size="11" fill="#F8FAFC">
          Laurent,Claire,33,Nantes
        </text>
        <text x="0" y="65" font-family="'Courier New', monospace" font-size="11" fill="#F8FAFC">
          Simon,Alex,27,Toulouse
        </text>
        <text x="0" y="85" font-family="'Courier New', monospace" font-size="11" fill="#F8FAFC">
          Roux,Thomas,38,Strasbourg
        </text>
        <text x="0" y="105" font-family="Arial, sans-serif" font-size="10" fill="#64748B" font-style="italic">
          Format: CSV (,)
        </text>
      </g>
    </g>
    
    <!-- Fichier 4 -->
    <g transform="translate(400, 420)">
      <rect width="220" height="140" rx="12" fill="#1E293B" stroke="#EC4899" stroke-width="2" filter="url(#shadow)"/>
      
      <g transform="translate(10, 15)">
        <text x="0" y="0" font-family="Arial, sans-serif" font-size="14" font-weight="700" fill="#EC4899">
          📄 fichier4.txt
        </text>
        <text x="0" y="25" font-family="'Courier New', monospace" font-size="11" fill="#94A3B8">
          Nom|Prénom|Age|Ville
        </text>
        <text x="0" y="45" font-family="'Courier New', monospace" font-size="11" fill="#F8FAFC">
          Blanc|Isabelle|30|Rennes
        </text>
        <text x="0" y="65" font-family="'Courier New', monospace" font-size="11" fill="#F8FAFC">
          Girard|Vincent|34|Dijon
        </text>
        <text x="0" y="85" font-family="'Courier New', monospace" font-size="11" fill="#F8FAFC">
          Faure|Camille|25|Angers
        </text>
        <text x="0" y="105" font-family="Arial, sans-serif" font-size="10" fill="#64748B" font-style="italic">
          Format: Pipe (|)
        </text>
      </g>
    </g>
    
    <!-- Problèmes identifiés -->
    <g transform="translate(150, 590)">
      <rect width="470" height="120" rx="12" fill="#7F1D1D" opacity="0.3" stroke="#DC2626" stroke-width="2"/>
      <text x="235" y="30" font-family="Arial, sans-serif" font-size="16" font-weight="700" fill="#FCA5A5" text-anchor="middle">
        ⚠️ PROBLÈMES
      </text>
      <text x="20" y="55" font-family="Arial, sans-serif" font-size="12" fill="#FEE2E2">
        • Formats multiples incohérents
      </text>
      <text x="20" y="75" font-family="Arial, sans-serif" font-size="12" fill="#FEE2E2">
        • Séparateurs différents (;, tabs, ,, |)
      </text>
      <text x="20" y="95" font-family="Arial, sans-serif" font-size="12" fill="#FEE2E2">
        • Traitement manuel long et source d'erreurs
      </text>
    </g>
  </g>
  
  <!-- ========== FLÈCHE DE TRANSFORMATION ========== -->
  <g id="transformation-arrow" transform="translate(700, 450)">
    <circle cx="0" cy="0" r="60" fill="url(#accentGrad)" opacity="0.2"/>
    <circle cx="0" cy="0" r="45" fill="url(#accentGrad)" filter="url(#glow)"/>
    
    <text x="0" y="10" font-size="32" text-anchor="middle">⚙️</text>
    
    <text x="0" y="-80" font-family="'Arial Black', sans-serif" font-size="18" font-weight="900" fill="#06B6D4" text-anchor="middle">
      PYTHON SCRIPT
    </text>
    <text x="0" y="-60" font-family="Arial, sans-serif" font-size="13" fill="#94A3B8" text-anchor="middle">
      Fusion automatique
    </text>
    
    <!-- Flèche droite -->
    <path d="M 60 0 L 120 0" stroke="#06B6D4" stroke-width="4" fill="none"/>
    <path d="M 115 -8 L 125 0 L 115 8 Z" fill="#06B6D4"/>
  </g>
  
  <!-- ========== SECTION APRÈS (DROITE) ========== -->
  <g id="after-section">
    <!-- Badge APRÈS -->
    <rect x="770" y="160" width="480" height="60" rx="12" fill="url(#successGrad)" opacity="0.2" stroke="url(#successGrad)" stroke-width="3"/>
    <text x="1010" y="198" font-family="'Arial Black', sans-serif" font-size="28" font-weight="900" fill="url(#successGrad)" text-anchor="middle">
      ✅ APRÈS — Données Unifiées
    </text>
    
    <!-- Fichier unifié -->
    <g transform="translate(820, 250)">
      <rect width="380" height="380" rx="12" fill="#1E293B" stroke="#10B981" stroke-width="3" filter="url(#shadow)"/>
      
      <g transform="translate(15, 20)">
        <text x="0" y="0" font-family="Arial, sans-serif" font-size="16" font-weight="700" fill="#10B981">
          📊 donnees_consolidees.csv
        </text>
        
        <rect x="0" y="15" width="350" height="2" fill="#10B981" opacity="0.3"/>
        
        <text x="0" y="40" font-family="'Courier New', monospace" font-size="11" fill="#10B981" font-weight="700">
          Nom,Prénom,Age,Ville
        </text>
        
        <!-- Données du fichier 1 -->
        <text x="0" y="65" font-family="'Courier New', monospace" font-size="11" fill="#D1FAE5">
          Martin,Sophie,28,Paris
        </text>
        <text x="0" y="85" font-family="'Courier New', monospace" font-size="11" fill="#D1FAE5">
          Dubois,Luc,35,Lyon
        </text>
        <text x="0" y="105" font-family="'Courier New', monospace" font-size="11" fill="#D1FAE5">
          Bernard,Emma,42,Lille
        </text>
        
        <!-- Données du fichier 2 -->
        <text x="0" y="125" font-family="'Courier New', monospace" font-size="11" fill="#D1FAE5">
          Petit,Marie,31,Nice
        </text>
        <text x="0" y="145" font-family="'Courier New', monospace" font-size="11" fill="#D1FAE5">
          Robert,Paul,29,Marseille
        </text>
        <text x="0" y="165" font-family="'Courier New', monospace" font-size="11" fill="#D1FAE5">
          Moreau,Julie,26,Bordeaux
        </text>
        
        <!-- Données du fichier 3 -->
        <text x="0" y="185" font-family="'Courier New', monospace" font-size="11" fill="#D1FAE5">
          Laurent,Claire,33,Nantes
        </text>
        <text x="0" y="205" font-family="'Courier New', monospace" font-size="11" fill="#D1FAE5">
          Simon,Alex,27,Toulouse
        </text>
        <text x="0" y="225" font-family="'Courier New', monospace" font-size="11" fill="#D1FAE5">
          Roux,Thomas,38,Strasbourg
        </text>
        
        <!-- Données du fichier 4 -->
        <text x="0" y="245" font-family="'Courier New', monospace" font-size="11" fill="#D1FAE5">
          Blanc,Isabelle,30,Rennes
        </text>
        <text x="0" y="265" font-family="'Courier New', monospace" font-size="11" fill="#D1FAE5">
          Girard,Vincent,34,Dijon
        </text>
        <text x="0" y="285" font-family="'Courier New', monospace" font-size="11" fill="#D1FAE5">
          Faure,Camille,25,Angers
        </text>
        
        <rect x="0" y="300" width="350" height="2" fill="#10B981" opacity="0.3"/>
        
        <text x="0" y="325" font-family="Arial, sans-serif" font-size="12" fill="#34D399" font-weight="700">
          ✓ Format uniforme: CSV standard
        </text>
        <text x="0" y="345" font-family="Arial, sans-serif" font-size="12" fill="#34D399" font-weight="700">
          ✓ Encodage: UTF-8
        </text>
      </g>
    </g>
    
    <!-- Avantages -->
    <g transform="translate(820, 660)">
      <rect width="380" height="120" rx="12" fill="#064E3B" opacity="0.3" stroke="#059669" stroke-width="2"/>
      <text x="190" y="30" font-family="Arial, sans-serif" font-size="16" font-weight="700" fill="#6EE7B7" text-anchor="middle">
        ✨ BÉNÉFICES
      </text>
      <text x="20" y="55" font-family="Arial, sans-serif" font-size="12" fill="#D1FAE5">
        • Fichier unique prêt à l'emploi
      </text>
      <text x="20" y="75" font-family="Arial, sans-serif" font-size="12" fill="#D1FAE5">
        • Compatible avec Excel, pandas, SQL
      </text>
      <text x="20" y="95" font-family="Arial, sans-serif" font-size="12" fill="#D1FAE5">
        • Gain de temps de 95% sur le traitement
      </text>
    </g>
  </g>
  
  <!-- Métrique en bas -->
  <g transform="translate(700, 830)">
    <rect x="-180" y="-35" width="360" height="70" rx="12" fill="#1E293B" stroke="#06B6D4" stroke-width="2"/>
    <text x="0" y="-5" font-family="'Arial Black', sans-serif" font-size="28" font-weight="900" fill="#06B6D4" text-anchor="middle">
      4 fichiers → 1 fichier
    </text>
    <text x="0" y="20" font-family="Arial, sans-serif" font-size="14" fill="#94A3B8" text-anchor="middle">
      Automatisation complète en quelques secondes
    </text>
  </g>
</svg>